[workspace]
resolver = "2"
members = ["src-tauri", "crates/app-core", "crates/app-platform", "crates/app-mcp"]
exclude = ["vendor/tauri-plugin-updater", "vendor/ctor", "vendor/dirs-sys", "vendor/pageant", "vendor/webview2-com-sys", "vendor/wry"]

[patch.crates-io]
# 与 dbx 同款 vendor 策略：保留定制上游，保证更新/运行机制的稳健行为。
tauri-plugin-updater = { path = "vendor/tauri-plugin-updater" }
wry = { path = "vendor/wry" }
webview2-com-sys = { path = "vendor/webview2-com-sys" }
ctor = { path = "vendor/ctor" }
dirs-sys = { path = "vendor/dirs-sys" }
pageant = { path = "vendor/pageant" }

[profile.dev.package."*"]
debug = "line-tables-only"

[profile.release]
panic = "abort"
strip = true
lto = true
codegen-units = 1
opt-level = "s"
