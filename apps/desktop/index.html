<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyApp</title>
    <style>
      html,
      body,
      #root {
        background-color: rgb(255 255 255);
        margin: 0;
        padding: 0;
      }

      html[data-theme="dark"],
      html[data-theme="dark"] body,
      html[data-theme="dark"] #root {
        background-color: rgb(19 20 22);
      }

      #startup-loading {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        color: #6b7280;
        font:
          14px system-ui,
          sans-serif;
      }

      #startup-loading .startup-brand {
        color: #111827;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.5px;
      }

      html[data-theme="dark"] #startup-loading .startup-brand {
        color: #f3f4f6;
      }

      #startup-loading .startup-spinner {
        width: 22px;
        height: 22px;
        box-sizing: border-box;
        border: 2px solid rgba(107, 114, 128, 0.22);
        border-top-color: currentColor;
        border-radius: 999px;
        animation: myapp-startup-spin 0.8s linear infinite;
      }

      @keyframes myapp-startup-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="startup-loading">
      <div class="startup-brand">MyApp</div>
      <div class="startup-spinner"></div>
      <div>正在启动…</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
