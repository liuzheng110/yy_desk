[package]
name = "myapp"
version = "0.1.2"
description = "MyApp desktop framework (Tauri 2 shell)"
authors = ["you"]
license = "Apache-2.0"
repository = ""
edition = "2021"
rust-version = "1.88.0"

[lib]
name = "myapp_lib"
crate-type = ["rlib"]

[features]
default = ["system-fonts"]
custom-protocol = ["tauri/custom-protocol"]
system-fonts = ["app-core/system-fonts"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2.7.0"
tauri-plugin-fs = "2.5.0"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "=2.10.1"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
percent-encoding = "2"
minisign-verify = "0.2.5"
semver = "1"
sha2 = "0.10"
zip = "4.6.1"
app-core = { path = "../crates/app-core", default-features = false }
app-platform = { path = "../crates/app-platform" }
app-mcp = { path = "../crates/app-mcp" }
tauri-plugin-clipboard-manager = "2.3.2"
sys-locale = "0.3"
sysinfo = { version = "0.32", features = ["system"] }

[dev-dependencies]
tauri = { version = "2.10.3", features = ["test"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSButton", "NSControl", "NSDockTile", "NSEvent", "NSImage", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData", "NSString"] }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
wry = { path = "../vendor/wry" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
